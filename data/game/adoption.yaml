# LAYER 3: game data (invented, not canon).
# How a newly adopted dragon is rolled (Plan §9.5). Kept apart from the matching files on
# purpose: editing this never changes who matches with which dragon, so it doesn't need
# `pnpm match:calibrate`.
#
# - personality_sigma: each trait = species trait + a normal draw with this spread, clamped
#   0-100, so no two dragons of a species are identical.
# - stat_start: a new dragon's stats are this share of the species' stat_caps (random within).
# - quirks: each dragon gets 1-2. `likes` / `dislikes` are added to the dragon's own lists.
# - color_variants: per matchable species (species_profiles.yaml); every one needs at least one.

version: adoption_v1

personality_sigma: 6
stat_start: { min: 0.30, max: 0.40 }
quirks_per_dragon: { min: 1, max: 2 }

start:
  needs: { hunger: 30, energy: 80, happiness: 60 }
  trust: 20

name:
  min_length: 2
  max_length: 20

quirks:
  - { id: hoards_shiny, label: "Hoards shiny things", likes: [shiny things] }
  - { id: afraid_of_thunder, label: "Afraid of thunder", dislikes: [thunderstorms] }
  - { id: sneezes_sparks, label: "Sneezes sparks when excited" }
  - { id: sun_napper, label: "Naps in any patch of sun", likes: [sunny rocks] }
  - { id: chases_birds, label: "Can't resist chasing birds", likes: [birds] }
  - { id: hates_baths, label: "Sulks after getting wet", dislikes: [baths] }
  - { id: purrs_scratched, label: "Purrs when scratched under the chin", likes: [chin scratches] }
  - { id: picky_eater, label: "Sniffs every meal twice" }
  - { id: night_owl, label: "Most awake after dark", likes: [moonlight] }
  - { id: copycat, label: "Copies your gestures" }
  - { id: loud_snorer, label: "Snores like a rockslide" }
  - { id: eel_terror, label: "Panics at the smell of eel", dislikes: [eel] }

color_variants:
  night_fury: [{ name: midnight black, hex: "#1f2128" }, { name: storm grey, hex: "#5b6270" }]
  light_fury: [{ name: moon white, hex: "#e9e8e4" }, { name: pearl, hex: "#d9d2c3" }]
  stormcutter: [{ name: rust and cream, hex: "#b5652e" }, { name: slate blue, hex: "#55688a" }, { name: forest green, hex: "#3f6b45" }]
  deathgripper: [{ name: ember orange, hex: "#d9622b" }, { name: sulfur yellow, hex: "#d4b13a" }]
  rumblehorn: [{ name: moss brown, hex: "#6e6243" }, { name: bark grey, hex: "#7a746b" }]
  crimson_goregutter: [{ name: crimson, hex: "#a3202e" }, { name: deep maroon, hex: "#6b1f2a" }]
  snafflefang: [{ name: lichen green, hex: "#8a9a5b" }, { name: sandstone, hex: "#c7a47a" }]
  hobgobbler: [{ name: mud brown, hex: "#6b4f35" }, { name: olive, hex: "#6f7034" }]
  deadly_nadder: [{ name: sky blue, hex: "#4a90c8" }, { name: sunset orange, hex: "#e07a3c" }, { name: jade green, hex: "#3e9a74" }]
  gronckle: [{ name: granite brown, hex: "#7b5f4a" }, { name: boulder grey, hex: "#808080" }, { name: rusty red, hex: "#a1462d" }]
  hideous_zippleback: [{ name: swamp green, hex: "#4e6b3a" }, { name: amber, hex: "#d9962b" }]
  monstrous_nightmare: [{ name: flame red, hex: "#c8352a" }, { name: charcoal, hex: "#3a3a3f" }, { name: copper, hex: "#b06a3b" }]
  terrible_terror: [{ name: leaf green, hex: "#5a9a3c" }, { name: poppy red, hex: "#cf3b2f" }, { name: sand yellow, hex: "#d6b65c" }]
  hotburple: [{ name: lava orange, hex: "#d8572a" }, { name: dusty brown, hex: "#8a6e55" }]
  scuttleclaw: [{ name: river blue, hex: "#3f7fa6" }, { name: mossy green, hex: "#5f7f45" }]
