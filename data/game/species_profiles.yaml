  - id: night_fury
    rarity: legendary
    summary: Brilliant and fiercely loyal once trust is earned, but nobody's pet.
    traits: { courage: 70, curiosity: 60, loyalty: 85, aggression: 50, patience: 45, independence: 65, intelligence: 90 }
    weights: { intelligence: 2.0, loyalty: 1.5, independence: 1.5 }
    requirements: { intelligence: 60, loyalty: 55 }
    approach_pref: calm
    diet_likes: [fish]
    diet_dislikes: [eel]
    stat_caps: { speed: 100, agility: 95, strength: 70, firepower: 95, stamina: 85, intelligence: 95, obedience: 60 }

