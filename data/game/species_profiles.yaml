# LAYER 3: game data (invented balancing values, not canon).
# Personality and game profile for every MATCHABLE species. See Plan §9.3–9.5.
#
# - A species missing from this file is not matchable (titans such as the Red
#   Death and Bewilderbeast stay out on purpose; so do background-only species).
# - traits: the same 7 traits as the quiz (traits.yaml), 0–100.
# - weights: how much each trait counts when matching (default 1.0).
# - requirements: soft minimums for the PLAYER's traits. Missing them costs
#   score (Plan §9.3 step 3); it never blocks a match outright.
# - approach_pref: which first-contact choice it likes (calm | bold | gentle | playful).
# - diet_likes / diet_dislikes: from the food list below.
# - stat_caps: the ceiling for each game stat. A new dragon starts at 30–40%
#   of each cap (this replaces the Plan's separate base_stats).
# - Calibration (scripts/calibrate_matching.py) is expected to adjust
#   traits and weights; the personalities below are the starting draft.

version: profiles_v1

foods: [fish, chicken, mutton, rock, bread, eel]
stats: [speed, agility, strength, firepower, stamina, intelligence, obedience]

species:
